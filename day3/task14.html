<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const product = {name: "Laptop",price: 60000,category: "Electronics"};

            const getProductInfo = ({ name, price, category }) => {
                return `Product: ${name}Price: ₹${price}Category: ${category}`;};

                console.log(getProductInfo(product));

            const updatedProduct = {...product,price: 65000};

                console.log("\nUpdated Product:");
                console.log(updatedProduct.name);
                console.log(`Price: ${updatedProduct.price}`);
                console.log(`Category: ${updatedProduct.category}`);

                console.log("\nOriginal Price:", product.price);
    </script>
</body>
</html>
