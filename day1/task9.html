<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let mark = 30;

        if (mark >= 90) {
            console.log("A+");
            
        } else if (mark >= 75) {
            console.log("A");
            
        } else if (mark >= 60){
            console.log("B");
            
        }else if (mark >= 50){
            console.log("C");
            
        }else {
            console.log("Fail");
            
        }
    </script>
</body>
</html>
