<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
       const checking =(num)=>{
          return new Promise((resolve, reject) => {
            if (typeof num !== "number"){
                reject ("it is invalid");
            }else if (num % 2 === 0) {
                resolve(num + " Is Even");
            }else{
                resolve(num + " Is Odd")
            }
          })
       }

       checking(12)
       .then((result)=>{
           console.log(result)
       }).catch((e)=>{
        console.log(e);
        
       })

    </script>
</body>
</html>
